[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-debug-case-study"
version = "0.1.0"
description = "Project 9: RAG optimization and debugging case study with before-vs-after metrics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0"
]

[project.scripts]
rag-debug = "rag_debug_case_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

