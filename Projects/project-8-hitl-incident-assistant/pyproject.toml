[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hitl-incident-assistant"
version = "0.1.0"
description = "Project 8: long-lived human-in-the-loop incident assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0"
]

[project.scripts]
hitl-incident = "hitl_incident_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

