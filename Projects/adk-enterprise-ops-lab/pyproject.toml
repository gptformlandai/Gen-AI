[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-enterprise-ops-lab"
version = "0.1.0"
description = "Production-style Google ADK reference project for enterprise operations intelligence agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
adk = [
    "google-adk>=2.0.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
ops-lab = "enterprise_ops_lab.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

