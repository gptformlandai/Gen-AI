[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-change-workflow"
version = "0.1.0"
description = "Project 6: MCP-enabled change workflow with approval, cost, and latency budgets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0"
]

[project.scripts]
mcp-change = "mcp_change_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
