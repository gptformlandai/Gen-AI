[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-search-lab"
version = "0.1.0"
description = "Project 2: semantic search lab with exact and approximate vector retrieval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0"
]

[project.scripts]
semantic-search-lab = "semantic_search_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
