services:
  kg-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      KG_LAB_DATA_DIR: /app/data
      KG_LAB_EXPORT_DIR: /app/data/exports
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: change-me-change-me
    ports:
      - "8000:8000"
    depends_on:
      - neo4j

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/change-me-change-me
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
